trigger: none

pool:
  vmImage: ubuntu-latest

parameters: 
  - name: 'environment'
    default: devContoso
    values:
      - prod
      - test
      - devContoso

variables:
    environment: ${{ parameters.environment }}

stages:

  - stage: build
    jobs:
    - template: ./jobs/job-build-artifacts-all.yaml

  - stage: deploy
    dependsOn: [build]
    jobs:
    - template: ./jobs/job-deploy-artifacts.yaml
      parameters:
        environment: ${{ parameters.environment }}